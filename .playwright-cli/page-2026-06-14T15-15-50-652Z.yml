                  - text: Salut Valentin !
                  - text: "Excellente nouvelle pour commencer la journée : ta récupération est au"
                  - strong [ref=e485]: Vert (75%)
                  - text: aujourd'hui ! Cela signifie que ton corps est bien prêt à encaisser l'entraînement et à performer. C'est le moment idéal pour les séances de qualité.
                  - text: "### Analyse de ta journée d'entraînement :"
                  - text: "*"
                  - strong [ref=e486]: "Séance prévue :"
                  - text: Une
                  - strong [ref=e487]: longue sortie à vélo en endurance fondamentale (150 minutes en Zone 2)
                  - text: .
                  - text: "*"
                  - strong [ref=e488]: "Compatibilité avec ta récupération :"
                  - text: Parfaitement adaptée à ton état de forme "Vert". C'est une séance clé pour construire ta base aérobie.
                  - text: "*"
                  - strong [ref=e489]: "Conditions météo à Fribourg :"
                  - text: Elles sont idéales pour une sortie extérieure avec
                  - strong [ref=e490]: 25°C et un ciel dégagé
                  - text: .
                  - text: "*"
                  - strong [ref=e491]: "Mon conseil :"
                  - text: Profite de cette belle énergie et des conditions parfaites pour bien réaliser ta séance. N'oublie pas de bien t'hydrater et de prévoir ton ravitaillement pour maintenir ton énergie sur la durée.
                  - text: "### Pour t'aider à t'améliorer, une action est essentielle :"
                  - text: Actuellement, je n'ai pas accès à tes
                  - strong [ref=e492]: données de charge d'entraînement réelles (ATL, CTL, TSB)
                  - text: ni à ton
                  - strong [ref=e493]: RPE (Ressenti de l'Effort)
                  - text: sur tes séances passées.
                  - text: "*"
                  - strong [ref=e494]: "Pourquoi c'est important :"
                  - text: Ces données sont la
                  - strong [ref=e495]: preuve par la donnée
                  - text: qui me permettent de comprendre comment ton corps réagit à l'entraînement, d'identifier d'éventuels signes de fatigue accumulée, d'ajuster l'intensité ou la durée de tes séances et de prévenir le surentraînement. Sans elles, mes conseils sont moins précis et personnalisés.
                  - text: "*"
                  - strong [ref=e496]: "Action clé :"
                  - text: Pour qu'on puisse travailler efficacement ensemble et que je t'aide à progresser au mieux, il est
                  - strong [ref=e497]: crucial que tu renseignes systématiquement ton RPE et le statut de tes séances
                  - text: (terminée, modifiée, manquée) après chaque entraînement. C'est la base de notre suivi.
                  - text: "### En attendant d'avoir plus de données, voici quelques pistes générales pour progresser :"
                  - text: "*"
                  - strong [ref=e498]: "Consistance :"
                  - text: La régularité est ta meilleure alliée en endurance. Essaie de suivre ton planning au maximum.
                  - text: "*"
                  - strong [ref=e499]: "Écoute ton corps :"
                  - text: Même avec une bonne récupération, ton RPE est un indicateur précieux. Si tu ressens une fatigue anormale sur une séance facile (par exemple, un RPE 8/10 sur un footing Z2), c'est un signal à investiguer.
                  - text: "*"
                  - strong [ref=e500]: "Nutrition & Hydratation :"
                  - text: Ce sont les fondations de ta performance et de ta récupération. Une bonne alimentation et une hydratation suffisante avant, pendant et après l'effort sont non négociables.
                  - text: "*"
                  - strong [ref=e501]: "Sommeil :"
                  - text: Assure-toi d'avoir un sommeil de qualité et en quantité suffisante. C'est le moment où ton corps se répare et s'adapte.
                  - text: Comment te sens-tu avant cette longue sortie aujourd'hui, Valentin ? Et n'oublie pas de me donner ton RPE après la séance !
